name: PR checks

on:
  pull_request:
  workflow_dispatch:

# Cancel a previous run for the same PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build (install + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Playwright tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      PLAYWRIGHT_HTML_OPEN: never
      # Values required by framework/configuration/configuration_helper.ts
      HEADLESS_BROWSER: true
      WORKERS: 1
      RETRY_FAILED: 2
      MAX_TEST_RUNTIME: 60000
      BASE_URL: ${{ vars.BASE_URL || 'https://the-internet.herokuapp.com' }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
